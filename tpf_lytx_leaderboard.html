<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TPF Driver Safety Leaderboard</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --navy: #1B2A4A;
    --orange: #D45F1E;
    --orange-light: #F07A3A;
    --bg: #0f1a2e;
    --surface: rgba(255,255,255,0.05);
    --surface2: rgba(255,255,255,0.08);
    --border: rgba(255,255,255,0.08);
    --text: #ffffff;
    --text2: rgba(255,255,255,0.6);
    --text3: rgba(255,255,255,0.35);
    --gold: #F5C842;
    --silver: #C0C8D8;
    --bronze: #CD7F32;
    --green: #4ADE80;
    --rad: 12px;
    --rad-sm: 8px;
  }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Animated background */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at 20% 50%, rgba(27,42,74,0.8) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 20%, rgba(212,95,30,0.15) 0%, transparent 50%);
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; padding: 1.5rem 2rem; max-width: 1400px; margin: 0 auto; }

  /* Header */
  header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 2rem; }
  .logo-area { display: flex; align-items: center; gap: 14px; }
  .logo-mark { width: 44px; height: 44px; background: var(--orange); border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .logo-mark svg { width: 24px; height: 24px; fill: #fff; }
  .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.02em; }
  .logo-sub { font-size: 13px; color: var(--text2); margin-top: 1px; }
  .header-right { text-align: right; }
  .period-badge { display: inline-block; background: var(--surface2); border: 0.5px solid var(--border); border-radius: 20px; padding: 5px 14px; font-size: 12px; color: var(--text2); font-family: 'DM Mono', monospace; }
  .updated-text { font-size: 11px; color: var(--text3); margin-top: 5px; font-family: 'DM Mono', monospace; }

  /* Loading */
  #loading { text-align: center; padding: 6rem 2rem; }
  .spinner { width: 40px; height: 40px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--orange); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 20px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading p { color: var(--text2); font-size: 15px; }
  #loading-detail { font-size: 12px; color: var(--text3); margin-top: 8px; font-family: 'DM Mono', monospace; }

  /* Login */
  #login-section { max-width: 420px; margin: 4rem auto; background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--rad); padding: 2rem; }
  #login-section h2 { font-size: 18px; font-weight: 600; margin-bottom: 6px; }
  #login-section p { font-size: 13px; color: var(--text2); margin-bottom: 1.5rem; }
  .field label { display: block; font-size: 11px; font-weight: 500; color: var(--text2); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.06em; }
  .field input { width: 100%; background: rgba(255,255,255,0.07); border: 0.5px solid var(--border); border-radius: var(--rad-sm); padding: 9px 12px; font-size: 14px; font-family: 'DM Sans', sans-serif; color: #fff; outline: none; margin-bottom: 12px; }
  .field input:focus { border-color: var(--orange); }
  .btn-login { width: 100%; background: var(--orange); color: #fff; border: none; border-radius: var(--rad-sm); padding: 11px; font-size: 14px; font-weight: 600; font-family: 'DM Sans', sans-serif; cursor: pointer; transition: background 0.15s; }
  .btn-login:hover { background: var(--orange-light); }
  .btn-login:disabled { opacity: 0.5; cursor: not-allowed; }
  .login-error { font-size: 12px; color: #f87171; margin-top: 8px; min-height: 18px; }
  .login-note { font-size: 11px; color: var(--text3); margin-top: 12px; text-align: center; }

  /* Dashboard */
  #dashboard { display: none; }

  /* Groups grid */
  .groups-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 1.5rem; }
  @media (max-width: 900px) { .groups-grid { grid-template-columns: 1fr; } }

  .group-card { background: var(--surface); border: 0.5px solid var(--border); border-radius: var(--rad); overflow: hidden; }
  .group-header { background: var(--navy); padding: 1rem 1.25rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); }
  .group-name { font-size: 16px; font-weight: 700; letter-spacing: -0.01em; }
  .group-meta { font-size: 11px; color: var(--text2); font-family: 'DM Mono', monospace; }
  .group-accent { width: 4px; height: 28px; border-radius: 2px; flex-shrink: 0; }

  /* Driver rows */
  .driver-list { padding: 0.5rem 0; }
  .driver-row { display: flex; align-items: center; gap: 12px; padding: 0.65rem 1.25rem; transition: background 0.12s; }
  .driver-row:hover { background: var(--surface2); }
  .rank { font-size: 13px; font-weight: 700; font-family: 'DM Mono', monospace; width: 24px; flex-shrink: 0; text-align: center; }
  .rank-1 { color: var(--gold); font-size: 15px; }
  .rank-2 { color: var(--silver); }
  .rank-3 { color: var(--bronze); }
  .rank-other { color: var(--text3); }
  .medal { font-size: 16px; width: 24px; text-align: center; flex-shrink: 0; }
  .driver-name { flex: 1; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .driver-name.top3 { font-weight: 600; }
  .score-area { display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
  .score-bar-track { width: 80px; height: 4px; background: rgba(255,255,255,0.08); border-radius: 2px; overflow: hidden; }
  .score-bar-fill { height: 100%; border-radius: 2px; }
  .score-val { font-size: 13px; font-weight: 600; font-family: 'DM Mono', monospace; min-width: 36px; text-align: right; }
  .events-pill { font-size: 10px; color: var(--text3); font-family: 'DM Mono', monospace; min-width: 52px; text-align: right; }
  .perfect-badge { font-size: 10px; background: rgba(74,222,128,0.15); color: var(--green); border-radius: 4px; padding: 2px 6px; font-weight: 600; }

  /* Divider */
  .driver-divider { height: 0.5px; background: var(--border); margin: 0 1.25rem; }

  /* Footer */
  footer { margin-top: 2rem; text-align: center; font-size: 11px; color: var(--text3); font-family: 'DM Mono', monospace; }

  /* Scrolling if needed for OptiSigns */
  .group-card.tall .driver-list { max-height: none; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo-area">
      <div class="logo-mark"><svg viewBox="0 0 16 16"><path d="M8 1L2 4v4c0 3.3 2.5 6.4 6 7 3.5-.6 6-3.7 6-7V4L8 1z"/></svg></div>
      <div>
        <div class="logo-text">Texas Pride Fuels</div>
        <div class="logo-sub">Driver Safety Leaderboard · Last 90 Days</div>
      </div>
    </div>
    <div class="header-right">
      <div class="period-badge" id="period-badge">Loading…</div>
      <div class="updated-text" id="updated-text"></div>
    </div>
  </header>

  <div id="login-section">
    <h2>Safety Leaderboard</h2>
    <p>Sign in to load live driver rankings from Lytx.</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="lytx-user" placeholder="your@email.com" autocomplete="username" onkeydown="if(event.key==='Enter')doLogin()">
      <label>Password</label>
      <input type="password" id="lytx-pass" placeholder="••••••••" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()">
    </div>
    <div class="login-error" id="login-error"></div>
    <button class="btn-login" id="login-btn" onclick="doLogin()">Load Leaderboard</button>
    <p class="login-note">🔒 Credentials sent directly to Lytx. Never stored.</p>
  </div>

  <div id="loading" style="display:none;">
    <div class="spinner"></div>
    <p>Building leaderboard…</p>
    <div id="loading-detail"></div>
  </div>

  <div id="dashboard">
    <div class="groups-grid" id="groups-grid"></div>
  </div>

  <footer id="footer" style="display:none;">
    Refreshes daily at 5:00 AM CT &nbsp;·&nbsp; Powered by Lytx &nbsp;·&nbsp; Texas Pride Fuels
  </footer>
</div>

<script>
const PROXY = 'https://lytx-proxy.k-hyche.workers.dev';

const GROUPS = {
  '5100ffff-60b6-e4cd-8fba-60a3e15b0000': 'Lube',
  '5100ffff-60b6-e4cd-8fb9-60a3e15b0000': 'AFS',
  '5100ffff-60b6-e4cd-c031-60a3e15b0000': 'Transport',
  '5100ffff-60b6-e5cd-5b73-60a3e15b0000': 'Route',
  '5100ffff-60b6-e5cd-8f82-60a3e15b0000': 'Transport',
};

const GROUP_COLORS = {
  'Lube':      '#D45F1E',
  'AFS':       '#1a5fa8',
  'Transport': '#0f6e56',
  'Route':     '#7f77dd',
};

const GROUP_ORDER = ['Transport', 'Lube', 'AFS', 'Route'];

let token = null;
let refreshTimer = null;

function isValidDriver(e) {
  const first = (e.driverFirstName || '').trim().toLowerCase();
  const last  = (e.driverLastName  || '').trim().toLowerCase();
  const full  = (first + ' ' + last).trim();
  if (!full) return false;
  if (full.includes('unknown')) return false;
  if (['mechanic','driver','vendor','contractor','lead'].includes(first)) return false;
  return true;
}

async function doLogin() {
  const user = document.getElementById('lytx-user').value.trim();
  const pass = document.getElementById('lytx-pass').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if (!user || !pass) { errEl.textContent = 'Please enter your username and password.'; return; }

  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Connecting…';

  try {
    const resp = await fetch(PROXY + '/login/api/auth/user', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    if (!resp.ok) throw new Error('Invalid credentials (HTTP ' + resp.status + ')');
    const data = await resp.json();
    token = data.access_token || data.token || data.authToken;
    if (!token) throw new Error('No token returned.');

    // Store credentials for auto-refresh
    sessionStorage.setItem('lytx_user', user);
    sessionStorage.setItem('lytx_pass', pass);

    document.getElementById('login-section').style.display = 'none';
    await loadLeaderboard();
    scheduleRefresh();
  } catch(e) {
    errEl.textContent = e.message.includes('Failed to fetch') ? 'Could not reach proxy.' : e.message;
    btn.disabled = false; btn.textContent = 'Load Leaderboard';
  }
}

async function refreshToken() {
  const user = sessionStorage.getItem('lytx_user');
  const pass = sessionStorage.getItem('lytx_pass');
  if (!user || !pass) return false;
  try {
    const resp = await fetch(PROXY + '/login/api/auth/user', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    const data = await resp.json();
    token = data.access_token || data.token;
    return !!token;
  } catch(e) { return false; }
}

function scheduleRefresh() {
  if (refreshTimer) clearTimeout(refreshTimer);
  const msUntil5amCT = getMsUntil5amCT();
  console.log('Next refresh in', Math.round(msUntil5amCT/1000/60), 'minutes');
  refreshTimer = setTimeout(async () => {
    const ok = await refreshToken();
    if (ok) await loadLeaderboard();
    scheduleRefresh();
  }, msUntil5amCT);
}

function getMsUntil5amCT() {
  const now = new Date();
  // CT is UTC-5 (CST) or UTC-6 (CDT) - use UTC-5 (CST)
  const utcOffset = -5 * 60;
  const ctNow = new Date(now.getTime() + utcOffset * 60000);
  const next5am = new Date(ctNow);
  next5am.setHours(5, 0, 0, 0);
  if (next5am <= ctNow) next5am.setDate(next5am.getDate() + 1);
  return next5am - ctNow;
}

async function loadLeaderboard() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('dashboard').style.display = 'none';
  document.getElementById('footer').style.display = 'none';

  const end   = new Date();
  const start = new Date(end.getTime() - 90 * 24 * 60 * 60 * 1000);
  const fmt   = d => d.toISOString().slice(0,19);

  // Paginate through all events
  const allEvents = [];
  let page = 1;
  while (true) {
    document.getElementById('loading-detail').textContent = `Page ${page} · ${allEvents.length} events loaded…`;
    const resp = await fetch(
      `${PROXY}/api/v0/video/safety/eventsWithMetadata?from=${fmt(start)}&to=${fmt(end)}&limit=1000&page=${page}&includeSubgroups=true`,
      { headers: { 'Authorization': 'Bearer ' + token } }
    );
    const data = await resp.json();
    if (!Array.isArray(data) || data.length === 0) break;
    allEvents.push(...data);
    if (data.length < 1000) break;
    page++;
  }

  document.getElementById('loading-detail').textContent = `Processing ${allEvents.length} events…`;

  // Build per-group driver map (combine Transport groups)
  const driverMap = {}; // group -> driverName -> { coachable, total, groupEventCount }
  GROUP_ORDER.forEach(g => driverMap[g] = {});

  // Track which group has more events for each driver (for cross-group dedup)
  const driverGroupCount = {}; // driverName -> { group -> count }

  for (const e of allEvents) {
    const gid = e.groupId;
    if (!GROUPS[gid]) continue;
    if (!isValidDriver(e)) continue;
    const group = GROUPS[gid];
    const name = (e.driverFirstName + ' ' + e.driverLastName).trim();

    if (!driverMap[group]) driverMap[group] = {};
    if (!driverMap[group][name]) driverMap[group][name] = { coachable: 0, total: 0, scoreSum: 0 };
    driverMap[group][name].total++;
    if (e.isCoachable) { driverMap[group][name].coachable++; driverMap[group][name].scoreSum += (e.score || 0); }

    // Track cross-group presence
    if (!driverGroupCount[name]) driverGroupCount[name] = {};
    if (!driverGroupCount[name][group]) driverGroupCount[name][group] = 0;
    driverGroupCount[name][group]++;
  }

  // For drivers appearing in multiple groups, keep only the group with highest event count
  const driverPrimaryGroup = {};
  for (const [name, groups] of Object.entries(driverGroupCount)) {
    const primary = Object.entries(groups).sort((a,b) => b[1]-a[1])[0][0];
    driverPrimaryGroup[name] = primary;
  }

  // Build final leaderboards, excluding drivers not in primary group
  const leaderboards = {};
  for (const group of GROUP_ORDER) {
    const drivers = driverMap[group] || {};
    const scored = [];
    for (const [name, stats] of Object.entries(drivers)) {
      if (driverPrimaryGroup[name] !== group) continue; // skip if primary group is elsewhere
      const avgScore = stats.coachable > 0 ? Math.round(stats.scoreSum / stats.coachable) : 0;
      scored.push({ name, ...stats, avgScore, displayScore: avgScore });
    }
    // Sort: fewest coachable first, then fewest total events as tiebreaker, then alpha
    scored.sort((a,b) => a.avgScore - b.avgScore || a.coachable - b.coachable || a.name.localeCompare(b.name));
    leaderboards[group] = scored.slice(0, 10);
  }

  renderLeaderboard(leaderboards, allEvents.length, start, end);
}

function renderLeaderboard(leaderboards, totalEvents, start, end) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('dashboard').style.display = 'block';
  document.getElementById('footer').style.display = 'block';

  const startStr = start.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  const endStr   = end.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  document.getElementById('period-badge').textContent = `${startStr} – ${endStr}`;
  document.getElementById('updated-text').textContent = 'Updated ' + new Date().toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});

  const grid = document.getElementById('groups-grid');
  grid.innerHTML = '';

  for (const group of GROUP_ORDER) {
    const drivers = leaderboards[group] || [];
    const color   = GROUP_COLORS[group] || '#888';
    const driverCount = drivers.length;

    const card = document.createElement('div');
    card.className = 'group-card';
    card.innerHTML = `
      <div class="group-header">
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="group-accent" style="background:${color};"></div>
          <div>
            <div class="group-name">${group}</div>
            <div class="group-meta">${driverCount} drivers ranked</div>
          </div>
        </div>
        <div style="font-size:11px;color:rgba(255,255,255,0.3);font-family:'DM Mono',monospace;">90-day window</div>
      </div>
      <div class="driver-list" id="list-${group}"></div>`;
    grid.appendChild(card);

    const list = document.getElementById('list-' + group);

    if (drivers.length === 0) {
      list.innerHTML = '<div style="padding:1.5rem;text-align:center;color:rgba(255,255,255,0.3);font-size:13px;">No data available</div>';
      continue;
    }

    const medals = ['🥇','🥈','🥉'];
    const maxCoachable = Math.max(...drivers.map(d => d.coachable), 1); // kept for reference

    drivers.forEach((d, i) => {
      const isPerfect = d.coachable === 0;
      const maxScore = Math.max(...drivers.map(d => d.avgScore), 1);
      const barPct    = isPerfect ? 100 : Math.max(5, Math.round((1 - d.avgScore / maxScore) * 100));
      const scoreColor = isPerfect ? '#4ADE80' : d.avgScore <= 20 ? '#60a5fa' : d.avgScore <= 50 ? '#fbbf24' : '#f87171';
      const rankClass = i < 3 ? `rank-${i+1}` : 'rank-other';

      const row = document.createElement('div');
      row.innerHTML = `
        <div class="driver-row">
          <div class="rank ${rankClass}">${i < 3 ? medals[i] : (i+1)}</div>
          <div class="driver-name ${i < 3 ? 'top3' : ''}">${d.name}</div>
          ${isPerfect ? '<span class="perfect-badge">PERFECT</span>' : ''}
          <div class="score-area">
            <div class="score-bar-track">
              <div class="score-bar-fill" style="width:${barPct}%;background:${scoreColor};"></div>
            </div>
            <div class="score-val" style="color:${scoreColor};">${d.avgScore}</div>
            <div class="events-pill">${d.coachable} event${d.coachable !== 1 ? 's' : ''}</div>
          </div>
        </div>
        ${i < drivers.length - 1 ? '<div class="driver-divider"></div>' : ''}`;
      list.appendChild(row);
    });
  }
}
</script>
</body>
</html>
